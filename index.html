<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro do Cliente - Versus</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.container {
    max-width: 420px;
    margin: 30px auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    color: purple;
}

h3 {
    margin-top: 20px;
    color: #444;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: purple;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>Versus Tecnologia</h2>

    <h3>Dados Pessoais</h3>
    <input type="text" id="nome" placeholder="Nome completo">
    <input type="text" id="cpf" placeholder="CPF">
    <input type="date" id="nascimento">
    <input type="email" id="email" placeholder="E-mail">

    <h3>Detalhes da Compra</h3>
    <input type="text" id="aparelho" placeholder="Aparelho desejado (modelo, cor, GB)">
    <input type="text" id="vencimento" placeholder="Dia de vencimento das parcelas">

    <h3>Endereço de Entrega</h3>
    <input type="text" id="cep" placeholder="CEP" onblur="buscarCEP()">
    <input type="text" id="rua" placeholder="Rua">
    <input type="text" id="numero" placeholder="Número">
    <input type="text" id="bairro" placeholder="Bairro">
    <input type="text" id="cidade" placeholder="Cidade">
    <input type="text" id="estado" placeholder="Estado">

    <button onclick="enviar()">Finalizar Cadastro</button>
</div>

<script>
// Máscara CPF
document.getElementById('cpf').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '');
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    e.target.value = v;
});

// Buscar CEP
function buscarCEP() {
    let cep = document.getElementById("cep").value.replace(/\D/g, '');
    
    if (cep.length === 8) {
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("rua").value = data.logradouro || '';
            document.getElementById("bairro").value = data.bairro || '';
            document.getElementById("cidade").value = data.localidade || '';
            document.getElementById("estado").value = data.uf || '';
        });
    }
}

// Enviar WhatsApp
function enviar() {

let nome = document.getElementById("nome").value;
let cpf = document.getElementById("cpf").value;
let nascimento = document.getElementById("nascimento").value;
let email = document.getElementById("email").value;

let aparelho = document.getElementById("aparelho").value;
let vencimento = document.getElementById("vencimento").value;

let cep = document.getElementById("cep").value;
let rua = document.getElementById("rua").value;
let numero = document.getElementById("numero").value;
let bairro = document.getElementById("bairro").value;
let cidade = document.getElementById("cidade").value;
let estado = document.getElementById("estado").value;

let mensagem = `Cadastro do Cliente - Versus

Nome: ${nome}
CPF: ${cpf}
Nascimento: ${nascimento}
E-mail: ${email}

📱 Aparelho desejado: ${aparelho}
📅 Vencimento das parcelas: ${vencimento}

Endereço:
CEP: ${cep}
Rua: ${rua}, Nº ${numero}
Bairro: ${bairro}
Cidade: ${cidade}
Estado: ${estado}

🔗 Acompanhar/Finalizar pedido:
https://sandwiche.me/vsapplestore

🔒 Segurança e privacidade
Seus dados são 100% protegidos e utilizados exclusivamente para análise e aprovação da compra no boleto bancário.`;

let url = "https://wa.me/5511944967694?text=" + encodeURIComponent(mensagem);

window.open(url, '_blank');
}
</script>

</body>
</html>
